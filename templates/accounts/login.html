{% extends 'base.html' %}

{% block title %}Login — FactoryOps{% endblock %}

{% block content %}
<div style="max-width: 420px; margin: 3rem auto;">
    <div class="card">
        <h2 style="font-size: 1.5rem; margin-bottom: 0.5rem; font-weight: 700;">Welcome Back</h2>
        <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 1.5rem;">Sign in to access factory operations & intelligence.</p>

        {% if form.errors %}
            <div style="background: rgba(244, 63, 94, 0.1); border: 1px solid var(--accent-rose); color: var(--accent-rose); padding: 0.75rem 1rem; border-radius: 8px; font-size: 0.875rem; margin-bottom: 1.25rem;">
                Invalid username or password. Please try again.
            </div>
        {% endif %}

        <form method="post" action="{% url 'accounts:login' %}">
            {% csrf_token %}
            <div style="margin-bottom: 1rem;">
                <label for="id_username" style="display: block; font-size: 0.85rem; font-weight: 500; color: var(--text-muted); margin-bottom: 0.35rem;">Username</label>
                <input type="text" name="username" id="id_username" required style="width: 100%; padding: 0.65rem 0.85rem; background: #0f172a; border: 1px solid var(--card-border); border-radius: 8px; color: var(--text-main); font-size: 0.95rem;">
            </div>
            <div style="margin-bottom: 1.5rem;">
                <label for="id_password" style="display: block; font-size: 0.85rem; font-weight: 500; color: var(--text-muted); margin-bottom: 0.35rem;">Password</label>
                <input type="password" name="password" id="id_password" required style="width: 100%; padding: 0.65rem 0.85rem; background: #0f172a; border: 1px solid var(--card-border); border-radius: 8px; color: var(--text-main); font-size: 0.95rem;">
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
        </form>
    </div>
</div>
{% endblock %}
